groups:
  - name: matjary
    rules:
      - alert: VpsUnavailable
        expr: up{job="vps"} == 0 or absent(up{job="vps"})
        for: 1m
        labels: { severity: critical }
      - alert: VpsHighCpu
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{job="vps",mode="idle"}[5m]))) > 90
        for: 5m
        labels: { severity: warning }
      - alert: VpsHighMemory
        expr: 1 - node_memory_MemAvailable_bytes{job="vps"} / node_memory_MemTotal_bytes{job="vps"} > 0.9
        for: 5m
        labels: { severity: warning }
      - alert: VpsDiskLow
        expr: node_filesystem_avail_bytes{job="vps",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="vps",fstype!~"tmpfs|overlay|squashfs"} < 0.1
        for: 5m
        labels: { severity: critical }
      - alert: VpsInodesLow
        expr: node_filesystem_files_free{job="vps",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_files{job="vps",fstype!~"tmpfs|overlay|squashfs"} < 0.1
        for: 5m
        labels: { severity: critical }
      - alert: ApiUnavailable
        expr: up{job="matjary"} == 0 or absent(up{job="matjary"})
        for: 1m
        labels: { severity: critical }
      - alert: ApiErrorRate
        expr: sum(rate(matjary_http_requests_total{status="5xx"}[5m])) / clamp_min(sum(rate(matjary_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
      - alert: WorkerUnavailable
        expr: matjary_worker_up == 0 or time() - matjary_worker_heartbeat_seconds > 30
        for: 1m
        labels: { severity: critical }
      - alert: MysqlUnavailable
        expr: matjary_mysql_up == 0
        for: 1m
        labels: { severity: critical }
      - alert: RedisUnavailable
        expr: matjary_redis_up == 0
        for: 1m
        labels: { severity: critical }
      - alert: MediaBacklog
        expr: matjary_media_outbox_age_seconds > 600 or matjary_queue_media_waiting > 100
        for: 5m
        labels: { severity: warning }
      - alert: MediaCleanupBacklog
        expr: matjary_media_cleanup_candidates > 100
        for: 15m
        labels: { severity: warning }
