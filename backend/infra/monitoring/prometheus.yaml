global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: vps
    static_configs:
      - targets: ['metrics-host:9100']
  - job_name: matjary
    metrics_path: /api/v1/internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['api:3000']
