# Local dependencies: npm run infra:up. API/worker are opt-in via --profile app.
# Add compose.production.yaml and a production env file for deployment.
# All host ports remain loopback-only; never remove database/media volumes.
name: matjary-local

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-matjary}
      MYSQL_USER: ${MYSQL_USER:-matjary}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
    command:
      [
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_0900_ai_ci',
      ]
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/.env}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in backend/.env}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ['app']
    image: matjary-api:${RELEASE_TAG:-local}
    init: true
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /var/lib/matjary/media
      MEDIA_TEMP_DIR: /app/.tmp/media
      WORKER_HEARTBEAT_FILE: /app/.tmp/worker-heartbeat
    volumes:
      - media-data:/var/lib/matjary/media
    stop_grace_period: 16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    profiles: ['app']
    image: matjary-worker:${RELEASE_TAG:-local}
    init: true
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    env_file:
      - ${APP_ENV_FILE:-../.env}
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /var/lib/matjary/media
      MEDIA_TEMP_DIR: /app/.tmp/media
      WORKER_HEARTBEAT_FILE: /app/.tmp/worker-heartbeat
    volumes:
      - media-data:/var/lib/matjary/media
    stop_grace_period: 16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const fs=require('node:fs');try{const age=Date.now()-Number(fs.readFileSync(process.env.WORKER_HEARTBEAT_FILE,'utf8'));process.exit(age>=0&&age<30000?0:1)}catch{process.exit(1)}",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: ['tools']
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - '127.0.0.1:${PHPMYADMIN_PORT:-8081}:80'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  media-data:
